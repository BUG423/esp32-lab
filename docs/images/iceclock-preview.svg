<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">IceClock HUB75 pixel clock preview</title>
  <desc id="desc">An icy blue pixel clock display beside a status panel showing NTP, RTC holdover, RGB PWM, and double buffering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.52" stop-color="#082f49"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.45" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pixels" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.2" fill="#bae6fd" opacity="0.14"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.7"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <circle cx="520" cy="330" r="360" fill="url(#halo)"/>
  <g fill="#e0f2fe" opacity="0.55">
    <circle cx="86" cy="98" r="3"/><circle cx="204" cy="51" r="2"/><circle cx="734" cy="73" r="3"/>
    <circle cx="1101" cy="104" r="2"/><circle cx="1018" cy="605" r="3"/><circle cx="68" cy="573" r="2"/>
    <path d="M156 164v24m-12-12h24m-20-8 16 16m0-16-16 16" stroke="#e0f2fe" stroke-width="2"/>
    <path d="M760 572v30m-15-15h30m-25-10 20 20m0-20-20 20" stroke="#e0f2fe" stroke-width="2"/>
  </g>

  <g font-family="Inter, 'Noto Sans SC', Arial, sans-serif">
    <g transform="translate(58 47)">
      <path d="M23 0v44M4 11l38 22M4 33l38-22M12 4l22 36M34 4 12 40" stroke="#a5f3fc" stroke-width="3" stroke-linecap="round"/>
      <text x="62" y="31" fill="#f0f9ff" font-size="30" font-weight="700">IceClock</text>
      <text x="208" y="29" fill="#7dd3fc" font-size="14" letter-spacing="2">HUB75 PIXEL DESK CLOCK</text>
    </g>

    <g transform="translate(58 127)" filter="url(#shadow)">
      <rect width="770" height="444" rx="28" fill="#030712" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2"/>
      <rect x="22" y="22" width="726" height="400" rx="15" fill="#061a2c"/>
      <rect x="22" y="22" width="726" height="400" rx="15" fill="url(#pixels)"/>
      <path d="M22 340C164 276 242 381 376 326S590 263 748 330V422H22Z" fill="#0c4a6e" opacity="0.4"/>
      <path d="M22 366C156 325 264 390 391 349s223-28 357 17v56H22Z" fill="#0369a1" opacity="0.26"/>

      <g transform="translate(68 61)">
        <text x="0" y="24" fill="#7dd3fc" font-size="15" font-weight="700" letter-spacing="3">WED · OCT 14</text>
        <text x="610" y="24" fill="#86efac" font-size="15" font-weight="700" text-anchor="end">● NTP</text>
      </g>

      <g transform="translate(58 124)" fill="url(#ice)" filter="url(#glow)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="800">
        <text x="0" y="126" font-size="142" letter-spacing="-12">20:26</text>
      </g>

      <g transform="translate(67 314)">
        <text fill="#bae6fd" font-size="18" font-weight="600">-1.5°C</text>
        <text x="610" fill="#bae6fd" font-size="18" font-weight="600" text-anchor="end">ICE FIELD · 72%</text>
        <rect y="24" width="610" height="4" rx="2" fill="#164e63"/>
        <rect y="24" width="442" height="4" rx="2" fill="url(#ice)"/>
      </g>

      <g transform="translate(0 0)" fill="#e0f2fe">
        <circle cx="114" cy="112" r="2"/><circle cx="201" cy="298" r="3"/><circle cx="688" cy="112" r="2"/>
        <circle cx="626" cy="293" r="3"/><circle cx="348" cy="105" r="2"/><circle cx="480" cy="303" r="2"/>
      </g>
    </g>

    <g transform="translate(861 127)" filter="url(#shadow)">
      <rect width="281" height="444" rx="24" fill="#071525" fill-opacity="0.94" stroke="#334155"/>
      <text x="26" y="42" fill="#bae6fd" font-size="14" font-weight="700" letter-spacing="1.6">CLOCK HEALTH</text>

      <g transform="translate(26 72)">
        <rect width="229" height="64" rx="15" fill="#072d32" stroke="#2dd4bf" stroke-opacity="0.4"/>
        <circle cx="28" cy="32" r="9" fill="#34d399"/>
        <text x="52" y="27" fill="#f0fdfa" font-size="14" font-weight="700">NTP SYNCHRONIZED</text>
        <text x="52" y="47" fill="#5eead4" font-size="12">RTC updated · Wi-Fi online</text>
      </g>

      <g transform="translate(26 157)">
        <text y="13" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.5">DISPLAY PIPELINE</text>
        <g transform="translate(0 30)">
          <rect width="68" height="48" rx="11" fill="#172554" stroke="#60a5fa" stroke-opacity="0.42"/>
          <text x="34" y="29" fill="#bfdbfe" font-size="12" font-weight="700" text-anchor="middle">FACE</text>
          <path d="M75 24h17" stroke="#64748b" stroke-width="2"/><path d="m88 19 6 5-6 5" fill="none" stroke="#64748b" stroke-width="2"/>
          <rect x="101" width="68" height="48" rx="11" fill="#164e63" stroke="#22d3ee" stroke-opacity="0.48"/>
          <text x="135" y="21" fill="#cffafe" font-size="11" font-weight="700" text-anchor="middle">DOUBLE</text>
          <text x="135" y="35" fill="#cffafe" font-size="11" font-weight="700" text-anchor="middle">BUFFER</text>
          <path d="M176 24h17" stroke="#64748b" stroke-width="2"/><path d="m189 19 6 5-6 5" fill="none" stroke="#64748b" stroke-width="2"/>
          <rect x="202" width="27" height="48" rx="10" fill="#1d4ed8"/>
          <text x="216" y="29" fill="#dbeafe" font-size="10" font-weight="700" text-anchor="middle">PWM</text>
        </g>
      </g>

      <g transform="translate(26 271)">
        <rect width="229" height="48" rx="12" fill="#0f2034"/>
        <text x="18" y="20" fill="#94a3b8" font-size="11">PANEL</text>
        <text x="18" y="37" fill="#e0f2fe" font-size="14" font-weight="700">64 × 32 · 1/16 scan</text>
        <text x="210" y="29" fill="#67e8f9" font-size="13" font-weight="700" text-anchor="end">4-bit RGB</text>
      </g>
      <g transform="translate(26 331)">
        <rect width="229" height="48" rx="12" fill="#0f2034"/>
        <text x="18" y="20" fill="#94a3b8" font-size="11">HOLDOVER</text>
        <text x="18" y="37" fill="#e0f2fe" font-size="14" font-weight="700">DS3231</text>
        <text x="210" y="29" fill="#a5b4fc" font-size="13" font-weight="700" text-anchor="end">READY</text>
      </g>

      <text x="140" y="414" fill="#64748b" font-size="11" letter-spacing="1.2" text-anchor="middle">ESP32-S3 · CORE 1 REFRESH</text>
    </g>
  </g>
</svg>
