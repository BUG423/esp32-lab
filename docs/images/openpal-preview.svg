<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">OpenPal local-first AI voice companion dashboard</title>
  <desc id="desc">A dark dashboard showing an interruptible streaming voice conversation, provider readiness, session isolation, and emotional state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#111a35"/>
      <stop offset="1" stop-color="#091d2a"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <circle cx="1038" cy="82" r="210" fill="#22d3ee" opacity="0.06"/>
  <circle cx="92" cy="640" r="250" fill="#8b5cf6" opacity="0.08"/>

  <g font-family="Inter, 'Noto Sans SC', Arial, sans-serif">
    <g transform="translate(58 48)">
      <circle cx="22" cy="22" r="22" fill="url(#orb)"/>
      <path d="M13 23c4-8 8-8 12 0s8 8 12 0" fill="none" stroke="#07111f" stroke-width="4" stroke-linecap="round"/>
      <text x="58" y="29" fill="#f8fafc" font-size="29" font-weight="700">OpenPal</text>
      <text x="198" y="28" fill="#94a3b8" font-size="15" letter-spacing="2">LOCAL-FIRST VOICE COMPANION</text>
    </g>

    <g transform="translate(804 54)" font-size="13" font-weight="600">
      <rect width="94" height="32" rx="16" fill="#052e2b" stroke="#2dd4bf" stroke-opacity="0.45"/>
      <circle cx="18" cy="16" r="4" fill="#2dd4bf"/><text x="31" y="21" fill="#99f6e4">ASR READY</text>
      <rect x="104" width="94" height="32" rx="16" fill="#172554" stroke="#60a5fa" stroke-opacity="0.45"/>
      <circle cx="122" cy="16" r="4" fill="#60a5fa"/><text x="135" y="21" fill="#bfdbfe">LLM LIVE</text>
      <rect x="208" width="94" height="32" rx="16" fill="#3b1d3b" stroke="#f472b6" stroke-opacity="0.45"/>
      <circle cx="226" cy="16" r="4" fill="#f472b6"/><text x="239" y="21" fill="#fbcfe8">TTS READY</text>
    </g>

    <g transform="translate(58 120)" filter="url(#shadow)">
      <rect width="760" height="487" rx="24" fill="#0f172a" fill-opacity="0.9" stroke="#334155"/>
      <text x="28" y="42" fill="#cbd5e1" font-size="14" font-weight="700" letter-spacing="1.5">SESSION · ESP32-DESK</text>
      <rect x="603" y="20" width="127" height="32" rx="16" fill="#16233c"/>
      <circle cx="621" cy="36" r="5" fill="#34d399"/><text x="635" y="41" fill="#a7f3d0" font-size="13">ISOLATED</text>

      <g transform="translate(28 80)">
        <rect width="500" height="78" rx="20" fill="#172554" stroke="#3b82f6" stroke-opacity="0.35"/>
        <text x="24" y="28" fill="#93c5fd" font-size="13" font-weight="700">YOU · 20:26</text>
        <text x="24" y="56" fill="#e2e8f0" font-size="18">帮我看看，今晚适合在阳台观星吗？</text>
      </g>

      <g transform="translate(118 182)">
        <rect width="612" height="123" rx="20" fill="#151b32" stroke="#8b5cf6" stroke-opacity="0.38"/>
        <circle cx="31" cy="31" r="17" fill="url(#orb)"/>
        <text x="60" y="29" fill="#c4b5fd" font-size="13" font-weight="700">OPENPAL · TOOL: WEATHER</text>
        <text x="25" y="68" fill="#f1f5f9" font-size="18">云量不高，九点后视野更清透。</text>
        <text x="25" y="96" fill="#cbd5e1" font-size="16">带件薄外套，我会在出门前再提醒你一次。</text>
      </g>

      <g transform="translate(28 344)">
        <rect width="704" height="70" rx="20" fill="#0b1220" stroke="#334155"/>
        <circle cx="36" cy="35" r="20" fill="#1e293b" stroke="#22d3ee"/>
        <rect x="31" y="24" width="10" height="22" rx="5" fill="#67e8f9"/>
        <path d="M25 37a11 11 0 0 0 22 0M36 48v8M29 56h14" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
        <g transform="translate(78 23)" fill="#22d3ee">
          <rect x="0" y="8" width="5" height="8" rx="2"/><rect x="11" y="3" width="5" height="18" rx="2"/>
          <rect x="22" width="5" height="24" rx="2"/><rect x="33" y="5" width="5" height="14" rx="2"/>
          <rect x="44" y="9" width="5" height="6" rx="2"/><rect x="55" y="2" width="5" height="20" rx="2"/>
          <rect x="66" y="7" width="5" height="10" rx="2"/><rect x="77" y="4" width="5" height="16" rx="2"/>
        </g>
        <text x="188" y="42" fill="#e2e8f0" font-size="15">按住说话 · 再次按下可随时打断</text>
        <rect x="576" y="19" width="106" height="32" rx="16" fill="#3f1d2e" stroke="#fb7185" stroke-opacity="0.5"/>
        <text x="598" y="40" fill="#fecdd3" font-size="13" font-weight="700">INTERRUPT</text>
      </g>

      <g transform="translate(28 446)" font-size="13" fill="#94a3b8">
        <text>PCM16 STREAM</text><circle cx="123" cy="-4" r="3" fill="#475569"/>
        <text x="136">16 kHz UP</text><circle cx="231" cy="-4" r="3" fill="#475569"/>
        <text x="244">24 kHz DOWN</text><circle cx="365" cy="-4" r="3" fill="#475569"/>
        <text x="378">PROTOCOL V2</text>
      </g>
    </g>

    <g transform="translate(846 120)" filter="url(#shadow)">
      <rect width="296" height="487" rx="24" fill="#0f172a" fill-opacity="0.9" stroke="#334155"/>
      <text x="26" y="42" fill="#cbd5e1" font-size="14" font-weight="700" letter-spacing="1.5">MOOD ENGINE</text>
      <g transform="translate(148 142)">
        <circle r="68" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>
        <circle r="57" fill="url(#orb)" opacity="0.95"/>
        <circle cx="-19" cy="-8" r="5" fill="#111827"/><circle cx="19" cy="-8" r="5" fill="#111827"/>
        <path d="M-22 17q22 20 44 0" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
      </g>
      <text x="148" y="237" fill="#f8fafc" font-size="21" font-weight="700" text-anchor="middle">温暖 · 专注</text>
      <text x="148" y="264" fill="#94a3b8" font-size="13" text-anchor="middle">VALENCE +0.72 · AROUSAL +0.38</text>

      <g transform="translate(26 303)">
        <text y="15" fill="#94a3b8" font-size="12">CONVERSATION MEMORY</text>
        <rect y="28" width="244" height="8" rx="4" fill="#1e293b"/>
        <rect y="28" width="174" height="8" rx="4" fill="url(#accent)"/>
        <text y="66" fill="#94a3b8" font-size="12">RESPONSE STREAM</text>
        <rect y="79" width="244" height="8" rx="4" fill="#1e293b"/>
        <rect y="79" width="216" height="8" rx="4" fill="url(#accent)"/>
      </g>

      <g transform="translate(26 420)">
        <rect width="244" height="42" rx="12" fill="#101f2d" stroke="#22d3ee" stroke-opacity="0.3"/>
        <text x="122" y="26" fill="#a5f3fc" font-size="13" font-weight="700" text-anchor="middle">BROWSER + ESP32 READY</text>
      </g>
    </g>
  </g>
</svg>
