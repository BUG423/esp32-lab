<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bytepet · 电子宠物</title>
<style>
  :root {
    --bg: #0b1020;
    --bg-soft: #141b32;
    --card: #1a2240;
    --text: #e8ecff;
    --muted: #8a94b8;
    --pink: #ffb4d0;
    --mint: #7ee8c7;
    --lavender: #c5b4ff;
    --peach: #ffc9a8;
    --accent: #7ee8c7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 800px at 20% -10%, #1b2648 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    padding: 24px 16px 48px;
    overflow-x: hidden;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  header {
    text-align: center;
    margin-bottom: 20px;
  }
  header h1 {
    font-size: 1.8rem;
    letter-spacing: 0.08em;
    background: linear-gradient(90deg, var(--mint), var(--lavender), var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
  }
  header p { color: var(--muted); margin-top: 6px; font-size: 0.92rem; }

  .stage-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid #2a3560;
    padding: 6px 14px;
    border-radius: 999px;
    margin-top: 10px;
    font-size: 0.95rem;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  }
  .stage-pill .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.25); opacity: 0.7; }
  }

  /* pet card */
  .pet-card {
    background: linear-gradient(180deg, var(--bg-soft), var(--card));
    border: 1px solid #263260;
    border-radius: 28px;
    padding: 28px 20px 22px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(0,0,0,0.35);
    position: relative;
    overflow: hidden;
  }
  .pet-card::before {
    content: "";
    position: absolute;
    inset: -40% -20% auto -20%;
    height: 220px;
    background: radial-gradient(closest-side, rgba(126,232,199,0.14), transparent);
    pointer-events: none;
  }

  .blob-stage {
    position: relative;
    height: 210px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  /* soft shadow under blob */
  .blob-shadow {
    position: absolute;
    bottom: 12px;
    width: 120px;
    height: 18px;
    border-radius: 50%;
    background: rgba(0,0,0,0.35);
    filter: blur(6px);
    transform: scaleX(1);
    transition: transform 0.4s ease;
  }

  .blob {
    width: 140px;
    height: 140px;
    background: var(--accent);
    border-radius: 46% 54% 52% 48% / 48% 46% 54% 52%;
    position: relative;
    animation: blob-bounce 2.6s ease-in-out infinite;
    box-shadow:
      inset -12px -16px 30px rgba(0,0,0,0.18),
      inset 12px 14px 24px rgba(255,255,255,0.22),
      0 14px 34px rgba(0,0,0,0.35);
    transition: background 0.5s ease, transform 0.35s ease, border-radius 0.6s ease;
  }

  @keyframes blob-bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(1.5deg); }
  }

  .blob.sad {
    animation: blob-droop 3.2s ease-in-out infinite;
    border-radius: 52% 48% 42% 58% / 58% 52% 48% 42%;
    transform: scaleY(0.92);
  }
  @keyframes blob-droop {
    0%, 100% { transform: translateY(0) scaleY(0.92); }
    50% { transform: translateY(6px) scaleY(0.88); }
  }

  .blob.sleeping {
    animation: blob-breathe 3.6s ease-in-out infinite;
  }
  @keyframes blob-breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  .blob.ghost {
    opacity: 0.72;
    filter: saturate(0.35);
    animation: blob-float 4s ease-in-out infinite;
  }
  @keyframes blob-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-18px); }
  }

  /* face */
  .eyes {
    position: absolute;
    top: 46px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 28px;
    pointer-events: none;
  }
  .eye {
    width: 18px;
    height: 22px;
    background: #20263f;
    border-radius: 50%;
    position: relative;
    animation: blink 4.2s infinite;
    box-shadow: inset 0 -2px 0 rgba(255,255,255,0.12);
  }
  .eye::after {
    content: "";
    position: absolute;
    top: 4px; left: 4px;
    width: 6px; height: 6px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.85;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.12); }
  }
  .blob.sad .eye,
  .blob.sleeping .eye {
    height: 8px;
    border-radius: 8px;
    animation: none;
    top: 58px;
  }

  .mouth {
    position: absolute;
    top: 84px;
    left: 0; right: 0;
    margin: 0 auto;
    width: 28px;
    height: 14px;
    border-bottom: 4px solid #20263f;
    border-radius: 0 0 28px 28px;
    transition: all 0.3s ease;
    pointer-events: none;
  }
  .blob.sad .mouth,
  .blob.hungry .mouth {
    border-bottom: none;
    border-top: 4px solid #20263f;
    border-radius: 28px 28px 0 0;
    top: 92px;
    height: 10px;
    width: 22px;
  }

  .blush {
    position: absolute;
    top: 72px;
    width: 16px;
    height: 10px;
    background: rgba(255,140,180,0.45);
    border-radius: 50%;
    filter: blur(1px);
  }
  .blush.left { left: 28px; }
  .blush.right { right: 28px; }

  /* emoji float */
  .emoji {
    font-size: 1.6rem;
    margin-top: 6px;
  }

  .emotion-label {
    font-size: 1.25rem;
    font-weight: 700;
    margin-top: 4px;
    letter-spacing: 0.04em;
  }
  .mood {
    color: var(--muted);
    margin-top: 8px;
    font-size: 0.95rem;
    line-height: 1.5;
    min-height: 1.5em;
  }

  /* stats */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 22px;
    text-align: left;
  }
  .stat {
    background: rgba(255,255,255,0.03);
    border: 1px solid #283361;
    border-radius: 16px;
    padding: 12px 14px;
  }
  .stat .label {
    display: flex;
    justify-content: space-between;
    font-size: 0.86rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .stat .val { color: var(--text); font-weight: 600; }
  .bar {
    height: 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .bar > span {
    display: block;
    height: 100%;
    border-radius: 999px;
    width: 50%;
    transition: width 0.6s ease;
    background: linear-gradient(90deg, #7ee8c7, #c5b4ff);
  }
  .bar.hunger > span { background: linear-gradient(90deg, #ffb4c8, #ffc9a8); }
  .bar.happy > span  { background: linear-gradient(90deg, #ffd86b, #ffb4c8); }
  .bar.energy > span { background: linear-gradient(90deg, #c5b4ff, #7ec8ff); }
  .bar.clean > span  { background: linear-gradient(90deg, #7ee8c7, #a8e6ff); }

  /* actions */
  .actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 22px;
  }
  button {
    appearance: none;
    border: 1px solid #2d3a6c;
    background: linear-gradient(180deg, #222c55, #1b2448);
    color: var(--text);
    font-size: 1rem;
    padding: 14px 8px;
    border-radius: 18px;
    cursor: pointer;
    font-weight: 600;
    letter-spacing: 0.02em;
    box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.2s ease;
  }
  button:hover { filter: brightness(1.12); }
  button:active {
    transform: translateY(2px) scale(0.98);
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  }

  /* log */
  .log-card {
    margin-top: 18px;
    background: var(--card);
    border: 1px solid #263260;
    border-radius: 20px;
    padding: 16px 18px;
    text-align: left;
  }
  .log-card h2 {
    font-size: 0.95rem;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  #log {
    list-style: none;
    max-height: 180px;
    overflow-y: auto;
    font-size: 0.92rem;
    line-height: 1.7;
  }
  #log li {
    padding: 4px 0;
    border-bottom: 1px dashed rgba(255,255,255,0.06);
    color: var(--text);
  }
  #log li .t {
    color: var(--muted);
    font-size: 0.8rem;
    margin-right: 8px;
  }

  footer {
    text-align: center;
    margin-top: 22px;
    color: var(--muted);
    font-size: 0.82rem;
    line-height: 1.8;
  }
  footer a { color: var(--lavender); text-decoration: none; }

  @media (max-width: 560px) {
    .actions { grid-template-columns: repeat(2, 1fr); }
    .stats { grid-template-columns: 1fr; }
    header h1 { font-size: 1.45rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>bytepet · 电子宠物</h1>
    <p>「电子宠物复活了」 · 桌面上的小生命 · live on ESP32</p>
    <div class="stage-pill">
      <span class="dot"></span>
      <span id="stage">孵化中…</span>
      <span style="color:var(--muted)">·</span>
      <span id="age">0 分钟</span>
    </div>
  </header>

  <section class="pet-card">
    <div class="blob-stage">
      <div class="blob-shadow" id="shadow"></div>
      <div class="blob" id="blob">
        <div class="eyes">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="blush left"></div>
        <div class="blush right"></div>
        <div class="mouth"></div>
      </div>
    </div>

    <div class="emoji" id="emoji">🥚</div>
    <div class="emotion-label" id="emotion">神秘的蛋</div>
    <div class="mood" id="mood">等待破壳的那一刻……</div>

    <div class="stats">
      <div class="stat">
        <div class="label"><span>🍚 饱食度 Hunger</span><span class="val" id="hunger-v">30</span></div>
        <div class="bar hunger"><span id="hunger-b" style="width:30%"></span></div>
      </div>
      <div class="stat">
        <div class="label"><span>💛 心情 Happiness</span><span class="val" id="happy-v">60</span></div>
        <div class="bar happy"><span id="happy-b" style="width:60%"></span></div>
      </div>
      <div class="stat">
        <div class="label"><span>⚡ 精力 Energy</span><span class="val" id="energy-v">80</span></div>
        <div class="bar energy"><span id="energy-b" style="width:80%"></span></div>
      </div>
      <div class="stat">
        <div class="label"><span>🧼 清洁 Cleanliness</span><span class="val" id="clean-v">90</span></div>
        <div class="bar clean"><span id="clean-b" style="width:90%"></span></div>
      </div>
    </div>

    <div class="actions">
      <button onclick="act('feed')">🍚 喂食</button>
      <button onclick="act('play')">🎮 玩耍</button>
      <button onclick="act('clean')">🧼 清洁</button>
      <button onclick="act('sleep')">😴 睡觉</button>
    </div>
  </section>

  <section class="log-card">
    <h2>事件日志 · Event Log</h2>
    <ul id="log"></ul>
  </section>

  <footer>
    bytepet · powered by ESP32 · WebSocket 实时同步<br>
    short-press button = feed · long-press = play
  </footer>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ws = null;
  var reconnectTimer = null;

  var STAGE_EMOJI = ["🥚", "🐣", "🐥", "🐶", "👻"];
  var STAGE_NAME = ["蛋", "幼年", "少年", "成年", "幽灵"];

  function setBar(name, v) {
    var el = $(name + "-b");
    var val = $(name + "-v");
    if (el) el.style.width = Math.max(0, Math.min(100, v)) + "%";
    if (val) val.textContent = v;
  }

  function applyState(s) {
    if (!s || s.type !== "state") return;

    $("stage").textContent = "阶段：" + (s.stage_name || STAGE_NAME[s.stage] || "?");
    $("age").textContent = "年龄：" + (s.age_minutes || 0) + " 分钟 · tick " + (s.tick || 0);

    $("emoji").textContent = s.emoji || STAGE_EMOJI[s.stage] || "❓";
    $("emotion").textContent = (s.emotion_name || "") + "";
    $("mood").textContent = s.mood || "";

    setBar("hunger", s.hunger);
    setBar("happy", s.happiness);
    setBar("energy", s.energy);
    setBar("clean", s.cleanliness);

    var blob = $("blob");
    blob.className = "blob";
    if (s.stage === 4 || !s.alive) blob.classList.add("ghost");
    else if (s.sleeping) blob.classList.add("sleeping");
    else if (s.emotion === 4 || s.emotion === 5) blob.classList.add("sad");
    else if (s.emotion === 1) blob.classList.add("hungry");

    if (s.color) document.documentElement.style.setProperty("--accent", s.color);

    if (s.log) pushLog(s.log);
  }

  function pushLog(msg) {
    var ul = $("log");
    if (!ul) return;
    // avoid duplicate spam of same line
    if (ul.firstChild && ul.firstChild.dataset && ul.firstChild.dataset.msg === msg) return;
    var li = document.createElement("li");
    li.dataset.msg = msg;
    var t = new Date();
    var hh = String(t.getHours()).padStart(2, "0");
    var mm = String(t.getMinutes()).padStart(2, "0");
    li.innerHTML = '<span class="t">' + hh + ":" + mm + '</span>' + msg;
    ul.insertBefore(li, ul.firstChild);
    while (ul.children.length > 40) ul.removeChild(ul.lastChild);
  }

  function act(name) {
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ action: name }));
    } else {
      fetch("/api/action", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: name })
      }).then(function (r) { return r.json(); }).then(function () {
        fetch("/api/state").then(function (r) { return r.json(); }).then(applyState);
      });
    }
  }

  function connect() {
    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(proto + location.host + "/ws");

    ws.onopen = function () {
      if (reconnectTimer) {
        clearInterval(reconnectTimer);
        reconnectTimer = null;
      }
    };
    ws.onmessage = function (ev) {
      try {
        applyState(JSON.parse(ev.data));
      } catch (e) { /* ignore */ }
    };
    ws.onclose = function () {
      if (!reconnectTimer) {
        reconnectTimer = setInterval(connect, 3000);
      }
    };
    ws.onerror = function () {
      try { ws.close(); } catch (e) {}
    };
  }

  // initial fetch fallback
  fetch("/api/state").then(function (r) { return r.json(); }).then(applyState).catch(function () {});
  connect();
})();
</script>
</body>
</html>
